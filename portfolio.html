 const body=tab==="sum"?`<div class="two"><div class="panel"><b>POSITION</b>${kv("Bought",R(h.boughtQ)+" kitta · Rs "+R(h.bought,2))}${kv("Sold",R(h.soldQ)+" kitta · Rs "+R(h.sold,2))}${kv("Bonus / rights",R(h.bonusQ)+" kitta")}${kv("Net held",R(h.q)+" kitta","","t")}</div>
 <div class="panel"><b>CHARGES</b>${kv("Charges on buys","Rs "+R(h.chgB,2))}${kv("Charges on sells","Rs "+R(h.chgS,2))}${kv("Total","Rs "+R(h.chgB+h.chgS,2),"","t")}${kv("Capital gains tax","Rs "+R(h.cgt,2))}</div>
 <div class="panel"><b>PROFIT &amp; LOSS</b>${kv("Sell proceeds (gross)","Rs "+R(h.sold,2))}${kv("− Charges on sells","Rs "+R(h.chgS,2))}${kv("− Cost of shares sold","Rs "+R(h.sold-h.chgS-h.pbt,2))}${kv("= Profit before tax","Rs "+R(h.pbt,2),C(h.pbt),"t")}${kv("− Capital gains tax","Rs "+R(h.cgt,2))}${kv("= Net profit / loss","Rs "+R(npl,2),C(npl),"t")}</div>
 <div class="panel"><b>COST BASIS</b>${kv("Buys (gross)","Rs "+R(h.bought,2))}${kv("+ Charges on buys","Rs "+R(h.chgB,2))}${kv("− Cost removed by sells","Rs "+R(h.sold-h.chgS-h.pbt,2))}${kv("= Cost basis still held","Rs "+R(h.c,2),"","t")}${kv("÷ Quantity held",R(h.q)+" kitta")}${kv("= WACC","Rs "+R(h.q?h.c/h.q:0,2),"","t")}</div></div>`
 :`<div class="tw"><table><thead><tr><th class="l">DATE</th><th>TYPE</th><th>QTY</th><th>RATE</th><th>GROSS</th><th>CHARGES</th><th>CGT</th><th>CUM COST</th><th>HELD</th><th>WACC</th><th></th></tr></thead><tbody>${T.map(t=>`<tr><td class="l">${esc(t.date)}</td><td class="${t.side=="buy"?"up":"dn"}"><b>${t.side.toUpperCase()}${t.price===0?" (bonus)":""}</b></td><td>${R(t.qty)}</td><td>${R(t.price,2)}</td><td>${R(t.gross,2)}</td><td>${R(t.chg,2)}</td><td>${t.cgt?R(t.cgt,2):"—"}</td><td>${R(t.cum,2)}</td><td>${R(t.held)}</td><td>${R(t.wacc,2)}</td><td><button onclick="delTx('${t.id}')" style="padding:2px 8px">✕</button></td></tr>`).join("")}</tbody></table></div>`;
 modal(`<div class="bar"><h3>${s}</h3><span class="mut">Transaction detail · ${esc(cur$().name)}</span><span class="sp"></span><button onclick="closeM()">✕</button></div>${top}<div class="tabs"><span class="${tab=="sum"?"on":""}" onclick="detail('${s}','sum')">Summary</span><span class="${tab=="tx"?"on":""}" onclick="detail('${s}','tx')">Transactions</span></div>${body}<div class="bar"><span class="mut">Commission slabs, SEBON 0.015% and DP Rs 25 are auto-calculated unless you override charges.</span><span class="sp"></span><button class="solid" onclick="closeM()">Done</button></div>`)};
window.realized=kind=>{const d=D;let E=d.ev;if(kind==="profit")E=E.filter(e=>e.net>0);if(kind==="loss")E=E.filter(e=>e.net<0);
 const day={};E.forEach(e=>{const x=day[e.date]=day[e.date]||{date:e.date,v:0,n:0,s:new Set()};x.v+=e.net;x.n++;x.s.add(e.s)});const L=Object.values(day).sort((a,b)=>b.date.localeCompare(a.date)),big=L.reduce((m,x)=>Math.abs(x.v)>Math.abs(m.v||0)?x:m,{});
 const cs=[["Realized profit",d.rp],["Realized loss",d.rl],["Net realized",d.nr],["Total CGT paid",d.cgt],["Broker+charges on sells",d.comm],["Total dividend",d.divs]];
 modal(`<div class="bar"><h3>${kind==="loss"?"Realized loss":kind==="net"?"Net realized P/L":"Realized profit"}</h3><span class="mut">Daily breakdown — grouped by day</span><span class="sp"></span><button onclick="closeM()">✕</button></div>
 <div class="g">${cs.map(c=>`<div class="k"><b>${c[0]}</b><div class="v">Rs ${R(c[1])}</div></div>`).join("")}</div>
 <div class="g" style="margin:10px 0"><div class="k"><b>Total</b><div class="v">Rs ${R(E.reduce((s,e)=>s+e.net,0))}</div></div><div class="k"><b>Active days</b><div class="v">${L.length}</div></div><div class="k"><b>Avg / active day</b><div class="v">Rs ${R(L.length?E.reduce((s,e)=>s+e.net,0)/L.length:0)}</div></div><div class="k"><b>Biggest day · ${big.date||"—"}</b><div class="v">Rs ${R(big.v||0)}</div></div></div>
 <div class="tw"><table><thead><tr><th class="l">DATE</th><th>REALIZED</th><th>TRADES</th><th class="l">SYMBOLS</th></tr></thead><tbody>${L.map(x=>`<tr><td class="l">${x.date}</td><td class="${C(x.v)}"><b>Rs ${R(x.v)}</b></td><td>${x.n}</td><td class="l">${[...x.s].join(", ")}</td></tr>`).join("")||`<tr><td colspan=4 class="mut">No sells in this period.</td></tr>`}</tbody></table></div>
 <div class="bar"><span class="mut">Totals reflect the selected period. Net = profit before tax − CGT.</span><span class="sp"></span><button class="solid" onclick="closeM()">Done</button></div>`)};
window.entry=(sym="",kind="buy")=>{const bonus=kind==="bonus";
 modal(`<div class="bar"><h3>${bonus?"Bonus / rights":kind==="sell"?"Sell":"Buy"} entry</h3><span class="sp"></span><button onclick="closeM()">✕</button></div>
 <form class="f" id="ef"><div><label>Symbol</label><input name="s" value="${sym}" style="text-transform:uppercase" required></div>
 <div><label>Type</label><select name="k"><option value="buy" ${kind==="buy"?"selected":""}>Buy</option><option value="sell" ${kind==="sell"?"selected":""}>Sell</option><option value="bonus" ${bonus?"selected":""}>Bonus shares (Rs 0)</option><option value="rights">Rights shares</option></select></div>
 <div><label>Quantity (kitta)</label><input name="q" type="number" min="1" required></div><div><label>Rate (Rs)</label><input name="p" type="number" step="0.01" min="0" value="${bonus?0:""}"></div>
 <div><label>Date (AD)</label><input name="d" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
 <div><label>Total charges override (optional)</label><input name="f" type="number" step="0.01" placeholder="auto: commission + SEBON + DP"></div>
 <div style="grid-column:1/-1" id="pv" class="mut"></div><div style="grid-column:1/-1"><button class="solid" type="submit">Save entry</button></div></form>`);
 const f=$("ef"),pv=()=>{const q=+f.q.value,p=+f.p.value,g=q*p;pv_.textContent=q&&p?`Gross Rs ${R(g,2)} · est. charges Rs ${R(comm(g)+g*CFG.sebon+CFG.dp,2)}`:""},pv_=$("pv");f.oninput=pv;
 f.onsubmit=async e=>{e.preventDefault();let k=f.k.value;const t={id:newId(),symbol:f.s.value.trim().toUpperCase(),side:k==="sell"?"sell":"buy",qty:+f.q.value,price:k==="bonus"?0:+f.p.value,date:f.d.value,fees:f.f.value===""?null:+f.f.value,note:k==="bonus"?"Bonus":k==="rights"?"Rights":"",auto:f.f.value===""};
 if(k==="sell"){const h=D.H[t.symbol];if(!h||h.q<t.qty){alert("You hold "+(h?h.q:0)+" kitta of "+t.symbol+" — can't sell "+t.qty);return}}
 cur$().transactions.push(t);await save();closeM();render()}};
$("addTx").onclick=()=>entry();
window.delTx=async id=>{if(!confirm("Delete this transaction? Holdings recalculate automatically."))return;const p=cur$();p.transactions=p.transactions.filter(t=>t.id!=id);await save();render();closeM()};
window.delStock=async s=>{if(!confirm(`Delete ALL transactions of ${s} from "${cur$().name}"? A backup file downloads first.`))return;backup();const p=cur$();p.transactions=p.transactions.filter(t=>t.symbol.toUpperCase()!==s);await save();render()};
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),portfolios:PF},null,2)],{type:"application/json"}));a.download="portfolio-backup-"+Date.now()+".json";a.click()}
/* ---- data ---- */
async function save(){localStorage.setItem("ee_portfoliosV2_"+uid,JSON.stringify(PF));$("stat").textContent="saving…";
 const{error}=await sb.from("portfolio_data").upsert({user_id:uid,portfolios:PF,current_portfolio_id:cur,schema_version:2,updated_at:new Date().toISOString()},{onConflict:"user_id"});$("stat").textContent=error?"⚠ "+error.message:"synced ✓"}
async function prices(){try{const j=await(await fetch(WORKER+"/all")).json();board={};(j.board||[]).forEach(r=>r.symbol&&(board[r.symbol.toUpperCase()]=r));$("stat").textContent="live · "+new Date().toLocaleTimeString()}catch(e){$("stat").textContent="price feed failed"}render()}
async function boot(id){uid=id;$("gate").hidden=true;$("app").hidden=false;
 const{data,error}=await sb.from("portfolio_data").select("portfolios,current_portfolio_id").eq("user_id",uid).maybeSingle();
 if(error||!data||!data.portfolios?.length){try{PF=JSON.parse(localStorage.getItem("ee_portfoliosV2_"+uid))||[]}catch(e){PF=[]}if(!PF.length)PF=[{id:newId(),name:"My Portfolio",transactions:[],watchlist:[],alerts:[],dividends:[]}];cur=PF[0].id}
 else{PF=data.portfolios;cur=PF.find(p=>p.id===data.current_portfolio_id)?data.current_portfolio_id:PF[0].id}
 PF.forEach(p=>{p.transactions=p.transactions||[];p.dividends=p.dividends||[]});
 const fill=()=>$("pf").innerHTML=PF.map(p=>`<option value="${p.id}" ${p.id===cur?"selected":""}>${esc(p.name)}</option>`).join("")+`<option value="__new">＋ Create portfolio…</option>`;fill();
 $("pf").onchange=async e=>{if(e.target.value==="__new"){const n=prompt("Portfolio name");if(n){const p={id:newId(),name:n,transactions:[],watchlist:[],alerts:[],dividends:[]};PF.push(p);cur=p.id;await save()}}else cur=e.target.value;fill();render()};
 await prices();setInterval(prices,30000)}
$("fs").onchange=$("fc").onchange=$("per").onchange=render;$("clr").onclick=()=>{$("fs").value="";$("fc").value="";render()};
$("login").onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("gm").textContent=error.message;else boot(data.user.id)};
$("out").onclick=()=>sb.auth.signOut().then(()=>location.reload());
sb.auth.getSession().then(({data})=>data.session?boot(data.session.user.id):$("gate").hidden=false);
</script></body></html>
