  .tx-fifo-total { display: grid; grid-template-columns: 90px 1fr 1fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 8px 0 2px; margin-top: 4px; border-top: 1px solid #2A3138; font-weight: 600; }

  /* Realized performance summary */
  .perf-panel { background: #1A1F24; border: 1px solid #2A3138; border-radius: 10px; padding: 20px; margin-bottom: 20px; display: none; }

  .perf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #2A3138; border: 1px solid #2A3138; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .perf-cell { background: #14181C; padding: 14px 16px; }

  .stock-perf-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px; }
  .stock-perf-table th { text-align: left; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: .06em; color: #6B7680; text-transform: uppercase; padding: 8px 8px; border-bottom: 1px solid #2A3138; }
  .stock-perf-table td { padding: 8px 8px; border-bottom: 1px solid #20262C; }
  .lot-status-tag { font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .02em; }
  .lot-status-tag.open { background: rgba(63,167,150,.15); color: #3FA796; }
  .lot-status-tag.partial { background: rgba(212,163,58,.15); color: #D4A33A; }
  .lot-status-tag.closed { background: rgba(107,118,128,.18); color: #9BA3AB; }

  .reconcile-note { font-family: 'Inter', sans-serif; font-size: 11px; color: #4A5158; margin-top: 14px; padding-top: 12px; border-top: 1px dashed #2A3138; }

  .reconcile-note.bad { color: #C4553D; }

  /* Generic app modal */
  .app-modal-overlay { position: fixed; inset: 0; background: rgba(6,8,10,0.65); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .app-modal-overlay.show { display: flex; }
  .app-modal-box { background: #1A1F24; border: 1px solid #2A3138; border-radius: 12px; padding: 22px; width: 100%; max-width: 340px; font-family: 'Inter', sans-serif; animation: modalPop .15s ease-out; }
  @keyframes modalPop { from { opacity: 0; transform: scale(.96) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .app-modal-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 12px; }
  .app-modal-icon.warn { background: rgba(196,85,61,.15); color: #C4553D; }
  .app-modal-icon.ask { background: rgba(63,167,150,.15); color: #3FA796; }
  .app-modal-icon.info { background: rgba(107,118,128,.18); color: #9BA3AB; }
  .app-modal-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #EDEFF1; }
  .app-modal-msg { font-size: 13px; color: #9BA3AB; line-height: 1.5; margin-bottom: 16px; }
  .app-modal-box input[type=text] { width: 100%; background: #14181C; border: 1px solid #2A3138; border-radius: 7px; padding: 10px 12px; color: #EDEFF1; font-size: 14px; font-family: inherit; margin-bottom: 16px; }
  .app-modal-box input[type=text]:focus { outline: none; border-color: #3FA796; }
  .app-modal-actions { display: flex; gap: 10px; }
  .app-modal-actions button { flex: 1; padding: 11px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600; border: 1px solid #2A3138; background: #1D2329; color: #EDEFF1; cursor: pointer; }
  .app-modal-actions button:hover { border-color: #3A424B; }
  .app-modal-actions .app-modal-ok { background: #3FA796; border-color: #3FA796; color: #0D1210; }
  .app-modal-actions .app-modal-ok.danger { background: #C4553D; border-color: #C4553D; color: #17110F; }
  .app-modal-actions.single button { flex: none; min-width: 120px; margin-left: auto; }

  /* Login gate */
  #loginGate { position: fixed; inset: 0; background: #0D1210; display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; font-family: 'Inter', sans-serif; }
  #loginGate.hide { display: none; }
  .lg-box { width: 100%; max-width: 340px; background: #1A1F24; border: 1px solid #2A3138; border-radius: 12px; padding: 26px; }

  .lg-msg.ok { color: #3FA796; }
  .lg-loading { font-size: 12.5px; color: #6B7680; }

  /* Target cursor */
  html.tc-active, html.tc-active * { cursor: none !important; }
  #tcCursor {
    position: fixed; top: 0; left: 0; width: 32px; height: 32px;
    margin-left: -16px; margin-top: -16px;
    border: 2px solid var(--tc-color, #ffffff);
    border-radius: 8px; pointer-events: none; z-index: 9999;
    transition: width .2s ease, height .2s ease, border-radius .2s ease,
                border-color .2s ease, transform .05s linear, opacity .15s ease;
    opacity: 0;
  }
  #tcCursor.tc-visible { opacity: 1; }
  #tcCursor.tc-on-target { border-radius: 6px; }
  #tcCursor::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: var(--tc-color, #ffffff); border-radius: 50%;
    transition: background .2s ease;
  }
</style>
