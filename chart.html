<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEPSE Chart Terminal · TradeCanvas</title>
<meta name="description" content="NEPSE charting terminal powered by TradeCanvas with live NEPSE board data." />
<link rel="stylesheet" href="css/tradecanvas/terminal.css" />
</head>
<body>
<div class="tcn-app" id="tcnApp">
  <header class="tcn-top">
    <a class="tcn-brand" href="dashboard.html" aria-label="NEPSE dashboard">NEPSE <span>Terminal</span></a>
    <nav class="tcn-nav" aria-label="Site">
      <a href="dashboard.html">Overview</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="chart.html" class="active" aria-current="page">Markets</a>
      <a href="index.html">Community</a>
    </nav>
    <div class="tcn-quote" id="tcnQuote" aria-live="polite">
      <span class="tcn-q-sym" id="qSym">—</span>
      <span class="tcn-q-name" id="qName"></span>
      <span class="tcn-q-ltp" id="qLtp">—</span>
      <span class="tcn-q-chg" id="qChg"></span>
      <span class="tcn-q-meta" id="qMeta"></span>
    </div>
    <div class="tcn-status">
      <span class="tcn-pill" id="pillMarket" title="Based on the NEPSE schedule (Sun–Thu, 11:00–15:00 NPT). Public holidays are not detected.">Market: —</span>
      <span class="tcn-pill" id="pillFeed" title="Connection to the NEPSE data workers">Feed: connecting…</span>
    </div>
  </header>
  <div class="tcn-banner" id="tcnBanner" role="alert" hidden>
    <span id="tcnBannerText"></span>
    <button type="button" id="tcnRetry">Retry</button>
  </div>
  <main class="tcn-main">
    <div id="tcnChart" class="tcn-chart"></div>
    <noscript><p class="tcn-noscript">This chart needs JavaScript.</p></noscript>
  </main>
  <footer class="tcn-foot">
    Data: NEPSE workers · daily candles (1D; 1W/1M are built from daily bars) · Intraday timeframes need an intraday data source and are not offered.
    <span class="tcn-foot-keys">Ctrl+K commands · Ctrl+P symbol · ? shortcuts</span>
  </footer>
</div>
<script src="vendor/tradecanvas/tradecanvas.iife.js"></script>
<script src="js/tradecanvas/config.js"></script>
<script src="js/tradecanvas/nepse-adapter.js"></script>
<script src="js/tradecanvas/app.js"></script>
</body>
</html>
